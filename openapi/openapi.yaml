openapi: 3.0.3
info:
  title: Accounts
  version: 1.0.0
  description: >
    Source of the account API. The server interface is generated from this file.
    Savings, checking, fixed-term accounts, movements, transfers, and debit cards.
paths:
  /api/v1/accounts:
    post:
      tags: [Account]
      operationId: open
      summary: Open an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAccountRequest"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [Account]
      operationId: all
      summary: List accounts
      responses:
        "200":
          description: All accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Account]
      operationId: one
      summary: Read one account
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    put:
      tags: [Account]
      operationId: update
      summary: Replace holders and signers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldersRequest"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [Account]
      operationId: delete
      summary: Delete an account
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/accounts/{id}/deposits:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Account]
      operationId: deposit
      summary: Deposit money
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountRequest"
      responses:
        "200":
          description: Account after the deposit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/accounts/{id}/withdrawals:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Account]
      operationId: withdraw
      summary: Withdraw money
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountRequest"
      responses:
        "200":
          description: Account after the withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/accounts/{id}/maintenance-fee:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Account]
      operationId: fee
      summary: Charge the maintenance fee
      responses:
        "200":
          description: Account after the fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/accounts/{id}/evaluate-average:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Account]
      operationId: average
      summary: Evaluate the minimum daily average
      responses:
        "200":
          description: Account after the evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/transfers:
    post:
      tags: [Account]
      operationId: transfer
      summary: Transfer between two accounts of this bank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "200":
          description: Source account after the transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/movements:
    get:
      tags: [Account]
      operationId: movements
      summary: List movements of one account
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ledger lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movement"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/movements/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Account]
      operationId: movement
      summary: Read one movement
      responses:
        "200":
          description: The movement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    put:
      tags: [Account]
      operationId: updateMovement
      summary: Replace the movement description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DescriptionRequest"
      responses:
        "200":
          description: Updated movement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [Account]
      operationId: deleteMovement
      summary: Delete a movement
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/debit-cards:
    post:
      tags: [Account]
      operationId: createCard
      summary: Issue a debit card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardRequest"
      responses:
        "201":
          description: Created card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebitCard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [Account]
      operationId: cards
      summary: List debit cards
      responses:
        "200":
          description: All debit cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DebitCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/debit-cards/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Account]
      operationId: card
      summary: Read one debit card
      responses:
        "200":
          description: The card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebitCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    put:
      tags: [Account]
      operationId: updateCard
      summary: Replace the main account of a debit card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardUpdateRequest"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebitCard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [Account]
      operationId: deleteCard
      summary: Delete a debit card
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/debit-cards/{id}/payments:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Account]
      operationId: pay
      summary: Pay a merchant with a debit card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountRequest"
      responses:
        "200":
          description: Debited account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/debit-cards/{id}/credit-payments:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Account]
      operationId: payCredit
      summary: Debit the card and request a credit payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPaymentRequest"
      responses:
        "200":
          description: Debited account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/account-reports:
    get:
      tags: [Account]
      operationId: report
      summary: List movements in an interval
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Movements in the interval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movement"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/account-reports/debit-cards/{id}/last:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Account]
      operationId: last
      summary: Ten newest debit-card movements
      responses:
        "200":
          description: Newest movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
components:
  securitySchemes:
    bearer-jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: A valid bearer token is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: A business rule rejected the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    OpenAccountRequest:
      type: object
      required: [customerId, accountType]
      properties:
        customerId:
          type: string
        accountType:
          type: string
          description: SAVINGS, CHECKING, or FIXED_TERM
        holderIds:
          type: array
          items:
            type: string
        signerIds:
          type: array
          items:
            type: string
        fixedTermDay:
          type: integer
          format: int32
        initialDeposit:
          type: number
    HoldersRequest:
      type: object
      properties:
        holderIds:
          type: array
          items:
            type: string
        signerIds:
          type: array
          items:
            type: string
    AmountRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
    DescriptionRequest:
      type: object
      properties:
        description:
          type: string
    TransferRequest:
      type: object
      required: [sourceAccountId, targetAccountId, amount]
      properties:
        sourceAccountId:
          type: string
        targetAccountId:
          type: string
        amount:
          type: number
    CardRequest:
      type: object
      required: [customerId, mainAccountId]
      properties:
        customerId:
          type: string
        mainAccountId:
          type: string
    CardUpdateRequest:
      type: object
      required: [mainAccountId]
      properties:
        mainAccountId:
          type: string
    CreditPaymentRequest:
      type: object
      required: [amount, productId, productKind, payerCustomerId]
      properties:
        amount:
          type: number
        productId:
          type: string
        productKind:
          type: string
          description: LOAN or CARD
        payerCustomerId:
          type: string
    Account:
      type: object
      properties:
        id:
          type: string
        accountNumber:
          type: string
        accountType:
          type: string
        primaryCustomerId:
          type: string
        customerType:
          type: string
        profile:
          type: string
        holderIds:
          type: array
          items:
            type: string
        signerIds:
          type: array
          items:
            type: string
        balance:
          type: number
        maintenanceFee:
          type: number
        maxMovementsPerMonth:
          type: integer
        fixedTermDay:
          type: integer
        minimumDailyAverage:
          type: number
        status:
          type: string
    Movement:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        type:
          type: string
        amount:
          type: number
        createdAt:
          type: string
          format: date-time
        operationId:
          type: string
        description:
          type: string
    DebitCard:
      type: object
      properties:
        id:
          type: string
        cardNumber:
          type: string
        customerId:
          type: string
        mainAccountId:
          type: string
        status:
          type: string
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
security:
  - bearer-jwt: []
